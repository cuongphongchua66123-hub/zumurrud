<!DOCTYPE html>
<html lang="fr" data-title-key="cancel_title"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zumurrud</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:wght@300;400&family=Caveat:wght@500&family=Amiri:wght@400;700&family=Aref+Ruqaa&display=swap" rel="stylesheet">
<style>
:root{--display:Marcellus,Georgia,serif;--body:Spectral,Georgia,serif;--hand:Caveat,cursive}
html[lang="ar"]{--display:Amiri,serif;--body:Amiri,serif;--hand:"Aref Ruqaa",Amiri,serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E3328;color:#EDEBDD;font-family:var(--body);font-weight:300;font-size:1.15rem;line-height:1.75;text-align:center;padding:2rem}
html[lang="ar"] body{font-weight:400;font-size:1.2rem}
.card{max-width:520px}
img{width:110px;margin:0 auto 1.5rem;display:block;filter:drop-shadow(0 20px 22px rgba(0,0,0,.45))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1.15;margin:0 0 .75rem;color:#E6C97E}
.hand{font-family:var(--hand);font-size:1.8rem;color:#E6C97E;margin-top:1.5rem}
a{display:inline-block;margin-top:2rem;font-family:var(--display);background:#C9A24B;color:#0E3328;padding:.8rem 1.5rem;text-decoration:none;border-radius:2px}
a:focus-visible{outline:2px solid #E6C97E;outline-offset:3px}
</style></head>
<body><div class="card">
<h1 data-i18n="cancel_title"></h1>
<p data-i18n="cancel_p"></p>
<a href="/#commander" data-i18n="resume"></a>
</div>
<script src="i18n.js"></script>
<script>applyLang(detectLang());</script>
</body></html>
